services:
  deepseek:
    image: deepseek-v41-flash-nvfp4:1017-sm120-t1
    platform: linux/amd64
    pull_policy: never
    init: true
    entrypoint: ["/opt/deepseek/.venv/bin/python", "-m", "sglang.launch_server"]
    gpus:
      - driver: nvidia
        device_ids: ["0", "1", "2", "3", "4", "5", "6", "7"]
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:30000:30000"
    volumes:
      - type: bind
        source: "${MODEL_PATH:?Set MODEL_PATH to /path/to/model}"
        target: /model
        read_only: true
        bind:
          create_host_path: false
      - runtime-cache:/cache
    environment:
      HF_HOME: /cache/hf
      ORVIX_ENGINE_TRACE: "0"
      ORVIX_DSV41_SKIP_ENGRAM_FADVISE: "1"
      SGLANG_SM120_FLASHMLA_BACKEND: flashinfer
      SGLANG_ENABLE_PCIE_IPC_ALLREDUCE: "1"
      # 4096 rows × 5120 hidden elements, including the large prefill reductions.
      SGLANG_PCIE_IPC_MAX_NUMEL: "20971520"
      SGLANG_DSPARK_SHARDED_ACCEPT: "1"
      SGLANG_DSPARK_FUSED_ACCEPT_TAIL: "1"
      SGLANG_OPT_DSV41_DSPARK_DRAFT_PREP_FORK: "1"
      SGLANG_OPT_DSV41_DSPARK_POST_FOLD: "1"
      SGLANG_OPT_DSV41_DSPARK_SKIP_PREFILLED_INPUTS: "1"
      SGLANG_OPT_DSV41_BLOCKWISE_REJECTION: "1"
      SGLANG_OPT_DSV41_DSPARK_ONE_LAUNCH_COMMIT_STAGE: "1"
      SGLANG_OPT_DSV41_DSPARK_PREPARE_INPUTS_ONCE: "1"
      SGLANG_OPT_DSV41_DSPARK_MID_FOLD: "1"
      SGLANG_OPT_CUDA_GRAPH_FILL_FAST_PATH: "1"
      SGLANG_OPT_SCHEDULER_SHM_SYNC: "1"
    command:
      - --model-path
      - /model
      - --served-model-name
      - deepseek-v41-flash-nvfp4-t1
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --trust-remote-code
      - --enable-multimodal
      - --tensor-parallel-size
      - "8"
      - --ep-size
      - "8"
      - --kv-cache-dtype
      - fp8_e4m3
      - --engram-config
      - '{"placement":"cpu","replication":"none","lookup":"auto"}'
      - --dsv4-attn-backend
      - flashmla
      - --moe-runner-backend
      - flashinfer_cutlass
      - --disable-shared-experts-fusion
      - --chunked-prefill-size
      - "2048"
      - --mem-fraction-static
      - "0.74"
      - --max-running-requests
      - "128"
      - --cuda-graph-backend-prefill
      - disabled
      - --cuda-graph-backend-decode
      - full
      - --cuda-graph-max-bs-decode
      - "64"
      - --reasoning-parser
      - auto
      - --tool-call-parser
      - auto
      - --enable-metrics
      - --enable-cache-report
      - --speculative-algorithm
      - DSPARK
      - --speculative-dspark-block-size
      - "5"
      - --speculative-moe-runner-backend
      - flashinfer_mxfp4
      - --default-chat-template-kwargs
      - '{"thinking":true}'
      - --enable-decoder-swa-bounded-replay
      - --enable-hierarchical-cache
      - --hicache-write-policy
      - write_back
      - --hicache-ratio
      - "0.45"
      - --swa-prefix-tails
      - "512"
      - --min-free-slots-delay
      - "0"
      - --torch-compile-max-bs
      - "128"
      - --random-seed
      - "0"
      - --disable-custom-all-reduce
      - --fp4-gemm-backend
      - flashinfer_cudnn

volumes:
  runtime-cache:
